<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Change Calculator</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-green-950 text-slate-100">
  <main class="mx-auto max-w-3xl px-4 py-12">

    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-center">Change Calculator</h1>
    </header>

    <section class="rounded-2xl bg-green-900/60 p-6 shadow-xl ring-1 ring-white/10 backdrop-blur">
      <div class="grid gap-5 md:grid-cols-2">
        <div>
          <label for="amount-due" class="block text-sm font-medium text-green-200">How much is due for the sale?</label>
          <input type="text" id="amount-due" inputmode="decimal" placeholder="i.e. 12.50"
            class="mt-2 w-full rounded-xl border border-white/10 bg-green-950/40 px-4 py-3 text-green-100 placeholder:text-slate-500 outline-none ring-0 transition focus:border-white/20 focus:outline-none focus:ring-4 focus:ring-blue-400/40" />
        </div>

        <div>
          <label for="amount-received" class="block text-sm font-medium text-green-200">How much has the customer given
            you?</label>
          <input type="text" id="amount-received" inputmode="decimal" placeholder="i.e. 20.00"
            class="mt-2 w-full rounded-xl border border-white/10 bg-green-950/40 px-4 py-3 text-green-100 placeholder:text-slate-500 outline-none ring-0 transition focus:border-white/20 focus:outline-none focus:ring-4 focus:ring-blue-400/40" />
        </div>

        <div class="mt-6 md:col-span-2">
          <button id="calculate-change"
            class="inline-flex w-full items-center justify-center rounded-xl bg-green-500 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/20 transition hover:bg-green-400 focus:outline-none focus:ring-4 focus:ring-blue-400/40 active:scale-95">
            Calculate!
          </button>

          <p class="text-sm text-center text-green-400 mt-3">
            Tip: use decimals like <span class="text-green-200">10.25</span>
          </p>
        </div>
      </div>
    </section>


    <section class="rounded-2xl bg-green-900/60 m-5 p-6 shadow-xl ring-1 ring-white/10 backdrop-blur">
      <div class="grid gap-4 sm:grid-cols-1">
        <div class="rounded-2xl bg-green-900/60 p-5 ring-1 ring-white/10 text-center shadow-md">
          <div class="items-center justify-between">
            <h3 class="text-lg font-medium text-green-300">Dollars</h3>
          </div>
          <p id="dollars-output" class="mt-3 text-3xl font-bold">0</p>
        </div>
      </div>
    </section>


    <section class="rounded-2xl bg-green-900/60 m-5 p-6 shadow-xl ring-1 ring-white/10 backdrop-blur mt-8">
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">

        <div class="rounded-2xl bg-green-900/60 p-5 ring-1 ring-white/10">
          <div class="text-center items-center justify-between">
            <h3 class="text-sm font-medium text-green-300">Quarters</h3>
            <p id="quarters-output">0</p>
          </div>
        </div>

        <div class="rounded-2xl bg-green-900/60 p-5 ring-1 ring-white/10">
          <div class="text-center items-center justify-between">
            <h3 class="text-sm font-medium text-green-300">Dimes</h3>
            <p id="dimes-output">0</p>
          </div>
        </div>

        <div class="rounded-2xl bg-green-900/60 p-5 ring-1 ring-white/10">
          <div class="text-center items-center justify-between">
            <h3 class="text-sm font-medium text-green-300">Nickels</h3>
            <p id="nickels-output">0</p>
          </div>
        </div>

        <div class="rounded-2xl bg-green-900/60 p-5 ring-1 ring-white/10">
          <div class="text-center items-center justify-between">
            <h3 class="text-sm font-medium text-green-300">Pennies</h3>
            <p id="pennies-output">0</p>
          </div>
        </div>
      </div>
    </section>
    
    <script src="main.js"></script>
  </main>
</body>

</html>
